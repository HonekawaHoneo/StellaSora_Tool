# Keep default detection rules. These scoped exceptions are public metadata.
# Digests require verified paths and values; workflow nonces require UUIDv4 token lines.
[extend]
useDefault = true

[[allowlists]]
description = "Verified SHA-256 for development/ui/summary-tokens.json"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['^\.harness/changes/mobile\-summary/inputs/ui\-1771e012356e47fb8138d884b27d8dc9\.json$']
regexes = [
  '^\s*"development/ui/summary\-tokens\.json"\s*:\s*"23ea5428aca46d4350888b5a2e5b3c5d3ee08cb85fd55accfacda91a57a14328"\s*,?\s*$',
]

[[allowlists]]
description = "Verified SHA-256 for development/ui/summary-tokens.json"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['^\.harness/changes/trim\-ui\-copy/inputs/ui\-99e26ffd58ee4678837bde3a111694d0\.json$']
regexes = [
  '^\s*"development/ui/summary\-tokens\.json"\s*:\s*"477cb74d5e54313ab31dacb3c64b8497676093c20f2c66037b889bbb3b17dbec"\s*,?\s*$',
]

[[allowlists]]
description = "Verified SHA-256 for .agents/skills/why/references/sources/sentry.md"
targetRules = ["sentry-access-token"]
condition = "AND"
regexTarget = "line"
paths = ['^\.harness/framework\.lock\.json$']
regexes = [
  '^\s*"\.agents/skills/why/references/sources/sentry\.md"\s*:\s*"2d4f83048eac1df530b399e2aed75dd7c9c18577b7665420aaeb96d0ceb0b702"\s*,?\s*$',
]

[[allowlists]]
description = "Public harness workflow UUIDv4 nonce fields (not authentication)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '^\.harness/changes/\.execution/(?:[a-f0-9]{12}4[a-f0-9]{3}[89ab][a-f0-9]{15}|contexts/[a-f0-9]{64})\.json$',
  '^\.harness/changes/[a-z0-9][a-z0-9-]*/skill-(?:discovery|requirements|design|implementation|review)(?:-[a-f0-9]{12}4[a-f0-9]{3}[89ab][a-f0-9]{15})?\.json$',
  '^\.harness/changes/[a-z0-9][a-z0-9-]*/state\.json$',
  '^\.harness/changes/game-purpose-ui/inputs/review-skill-application\.json$',
  '^\.harness/changes/\.inputs/cloud-install-application\.json$',
]
regexes = ['^\s*"token"\s*:\s*"[a-f0-9]{12}4[a-f0-9]{3}[89ab][a-f0-9]{15}"\s*,?\s*$']

[[allowlists]]
description = "Public harness skill-application event UUIDv4 nonce (not authentication)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['^\.harness/changes/[a-z0-9][a-z0-9-]*/events\.jsonl$']
regexes = ['^\s*\{"time": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?[+\-][0-9]{2}:[0-9]{2}", "event": "skill_application_verified", "token": "[a-f0-9]{12}4[a-f0-9]{3}[89ab][a-f0-9]{15}", "phase": "(?:discovery|requirements|design|implementation|review|done)", "request_digest": "[a-f0-9]{64}"\}\s*$']

[[allowlists]]
description = "Verified SHA-256 for development/ui/summary-tokens.json in game-purpose-ui snapshot"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['^\.harness/changes/game-purpose-ui/inputs/ui-4274fbc5be2f48bab5540dfaff4cc611\.json$']
regexes = ['^\s*"development/ui/summary-tokens\.json"\s*:\s*"477cb74d5e54313ab31dacb3c64b8497676093c20f2c66037b889bbb3b17dbec"\s*,?\s*$']

[[allowlists]]
description = "Verified public color-token SHA-256 in the two ui-b-no-percent snapshots"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '^\.harness/changes/ui-b-no-percent/inputs/ui-d15dfc3ec9e14540bad954b493bdd2ad\.json$',
  '^\.harness/changes/ui-b-no-percent/inputs/ui-186c878f8f314b79a9ec0941590b5570\.json$',
]
regexes = ['^\s*"development/ui/summary-tokens\.json"\s*:\s*"477cb74d5e54313ab31dacb3c64b8497676093c20f2c66037b889bbb3b17dbec"\s*,?\s*$']
