# Configure quality-policy reviewers, code-owner protection and required check 'verify' first.
# Protect this workflow and its base policy detector; a PR cannot approve itself.
name: Verify development change
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Default branch tip SHA; when running on that tip, use its first parent'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.policy.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate comparison base
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          test "$(git rev-parse "$BASE_SHA")" != "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          TRUSTED_BASE_SHA=$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")
          if [ "$(git rev-parse HEAD)" = "$TRUSTED_BASE_SHA" ]; then
            TRUSTED_BASE_SHA=$(git rev-parse HEAD^)
          fi
          test "$(git rev-parse "$BASE_SHA")" = "$TRUSTED_BASE_SHA"
      - id: policy
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          if git cat-file -e "$BASE_SHA:.harness/policy_changes.py"; then
            git show "$BASE_SHA:.harness/policy_changes.py" > "$RUNNER_TEMP/policy_changes.py"
            python3 "$RUNNER_TEMP/policy_changes.py" --base "$BASE_SHA" > "$RUNNER_TEMP/policy.json"
            python3 -c 'import json,sys; print("changed=" + str(bool(json.load(open(sys.argv[1])))).lower())' "$RUNNER_TEMP/policy.json" >> "$GITHUB_OUTPUT"
          else
            # Adoption has no trusted base detector and requires the owner.
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Require an existing protected approval environment
        if: steps.policy.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$REPOSITORY/environments/quality-policy" > "$RUNNER_TEMP/environment.json"
          python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); assert any(r.get("type")=="required_reviewers" and r.get("reviewers") for r in data.get("protection_rules",[])), "quality-policy needs owner reviewers"' "$RUNNER_TEMP/environment.json"
  approval:
    needs: policy
    if: needs.policy.outputs.changed == 'true'
    environment: quality-policy
    runs-on: ubuntu-latest
    steps:
      - run: echo 'The configured owner approved the policy change.'
  verify:
    needs: [policy, approval]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful prerequisites
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          POLICY_CHANGED: ${{ needs.policy.outputs.changed }}
          APPROVAL_RESULT: ${{ needs.approval.result }}
        run: |
          test "$POLICY_RESULT" = success
          if [ "$POLICY_CHANGED" = true ]; then
            test "$APPROVAL_RESULT" = success
          else
            test "$POLICY_CHANGED" = false
            test "$APPROVAL_RESULT" = skipped
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --require-hashes -r requirements-quality.txt
      # Add the target project's existing dependencies here.
      - name: Recheck current change against the selected comparison base
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: python3 .harness/harness.py --json ci --base "$BASE_SHA"
